name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - run: pnpm install --frozen-lockfile
      # Omarchy itself is required for plugin validation and is covered in the
      # local release gate. Keep hosted CI portable and dependency-free.
      - run: pnpm test && pnpm check && pnpm build
